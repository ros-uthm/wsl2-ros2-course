slam_toolbox:
  ros__parameters:
    use_sim_time: true
    slam_mode: mapping
    map_file_name: map
    map_start_pose: [0.0, 0.0, 0.0]
    map_update_interval: 2.0
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    transform_publish_period: 0.05
    scan_topic: /scan
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    mode: mapping
